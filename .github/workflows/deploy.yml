name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_PORT: "2203"

    steps:
      # webfactory/ssh-agent handles multiline private keys more reliably than
      # passing key: directly to appleboy/ssh-action (common CRLF / paste issues).
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Hetzner VPS
        id: deploy1
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=60 -p "$VPS_PORT" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /var/www/lindy_ai && if [ -f scripts/deploy.sh ]; then bash scripts/deploy.sh; else bash deploy.sh; fi'

      - name: Retry deploy if first attempt failed
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        run: |
          sleep 10
          ssh -o BatchMode=yes -o ConnectTimeout=60 -p "$VPS_PORT" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /var/www/lindy_ai && if [ -f scripts/deploy.sh ]; then bash scripts/deploy.sh; else bash deploy.sh; fi'

      - name: Mark job failed if both attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome != 'success'
        run: |
          echo "::error::SSH deploy failed. Check VPS_SSH_KEY matches authorized_keys for VPS_USER on port $VPS_PORT."
          echo "Test locally: ssh -i <private_key> -p $VPS_PORT <VPS_USER>@<VPS_HOST>"
          exit 1
