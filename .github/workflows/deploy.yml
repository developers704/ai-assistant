name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-2203}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Hetzner VPS
        id: deploy1
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-2203}"
          ssh -o BatchMode=yes -o ConnectTimeout=60 -p "$PORT" \
            "${VPS_USER}@${VPS_HOST}" \
            'cd /var/www/lindy_ai && if [ -f scripts/deploy.sh ]; then bash scripts/deploy.sh; else bash deploy.sh; fi'

      - name: Retry deploy if first attempt failed
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sleep 10
          PORT="${VPS_PORT:-2203}"
          ssh -o BatchMode=yes -o ConnectTimeout=60 -p "$PORT" \
            "${VPS_USER}@${VPS_HOST}" \
            'cd /var/www/lindy_ai && if [ -f scripts/deploy.sh ]; then bash scripts/deploy.sh; else bash deploy.sh; fi'

      - name: Mark job failed if both attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome != 'success'
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-2203}"
          echo "::error::SSH deploy failed. Check VPS_SSH_KEY matches authorized_keys for VPS_USER on port $PORT."
          echo "Test locally: ssh -i <private_key> -p $PORT <VPS_USER>@<VPS_HOST>"
          exit 1
