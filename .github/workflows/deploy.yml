name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Prefer base64 key (avoids Windows CRLF / paste corruption in VPS_SSH_KEY).
      # Fallback: raw multiline VPS_SSH_KEY for older setups.
      - name: Install SSH private key
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          write_raw_key() {
            # Normalize Windows CRLF; ensure trailing newline for OpenSSH.
            printf '%s' "$1" | tr -d '\r' > ~/.ssh/id_ed25519
            [ -n "$(tail -c1 ~/.ssh/id_ed25519 2>/dev/null || true)" ] && echo >> ~/.ssh/id_ed25519
          }     



          

          decode_b64_key() {
            printf '%s' "$1" | tr -d ' \n\r\t' | base64 -d > ~/.ssh/id_ed25519
          }

          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            echo "Using secret VPS_SSH_KEY_B64"
            decode_b64_key "$VPS_SSH_KEY_B64"
          elif [ -n "${VPS_SSH_KEY:-}" ]; then
            # Auto-detect: pasted base64 into VPS_SSH_KEY (common mistake).
            if printf '%s' "$VPS_SSH_KEY" | head -c 10 | grep -q 'BEGIN'; then
              echo "Using secret VPS_SSH_KEY (raw PEM)"
              write_raw_key "$VPS_SSH_KEY"
            else
              echo "Using secret VPS_SSH_KEY (detected base64)"
              decode_b64_key "$VPS_SSH_KEY"
            fi
          else
            echo "::error::Missing VPS_SSH_KEY_B64 or VPS_SSH_KEY"
            exit 1
          fi

          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/tmp/github_deploy.pub 2>/tmp/key_err; then
            echo "::error::SSH key invalid after decode. Prefer VPS_SSH_KEY_B64 from Downloads/github_deploy."
            echo "Key bytes: $(wc -c < ~/.ssh/id_ed25519)"
            cat /tmp/key_err || true
            exit 1
          fi
          echo "SSH key OK"
          ssh-keygen -lf /tmp/github_deploy.pub


      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-2203}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Hetzner VPS
        id: deploy1
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-2203}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -o ConnectTimeout=60 -p "$PORT" \
            "${VPS_USER}@${VPS_HOST}" \
            'cd /var/www/lindy_ai && if [ -f scripts/deploy.sh ]; then bash scripts/deploy.sh; else bash deploy.sh; fi'

      - name: Retry deploy if first attempt failed
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sleep 10
          PORT="${VPS_PORT:-2203}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -o ConnectTimeout=60 -p "$PORT" \
            "${VPS_USER}@${VPS_HOST}" \
            'cd /var/www/lindy_ai && if [ -f scripts/deploy.sh ]; then bash scripts/deploy.sh; else bash deploy.sh; fi'

      - name: Mark job failed if both attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome != 'success'
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-2203}"
          echo "::error::SSH deploy failed on port $PORT. Prefer secret VPS_SSH_KEY_B64 from a working local key file."
          exit 1
